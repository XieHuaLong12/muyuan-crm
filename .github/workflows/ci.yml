name: CRM CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/whatsapp-webhook

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: muyuan_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/muyuan_test
      AUTH_SECRET: ci-auth-secret-at-least-32-characters-long
      SEED_ADMIN_PASSWORD: ci-admin-password
      WEBHOOK_SECRET: ci-webhook-secret
      DEFAULT_TIMEZONE: Asia/Shanghai
      DEFAULT_CURRENCY: CNY
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare CI env file
        run: |
          cat > .env <<'EOF'
          DATABASE_URL="mysql://root:root@127.0.0.1:3306/muyuan_test"
          AUTH_SECRET="ci-auth-secret-at-least-32-characters-long"
          SEED_ADMIN_PASSWORD="ci-admin-password"
          WEBHOOK_SECRET="ci-webhook-secret"
          DEFAULT_TIMEZONE="Asia/Shanghai"
          DEFAULT_CURRENCY="CNY"
          EOF

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Verify existing MySQL automatic upgrade
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/muyuan_upgrade
        run: |
          mysql -h127.0.0.1 -uroot -proot -e 'CREATE DATABASE muyuan_upgrade'
          pnpm exec prisma db push --schema prisma/baseline/schema.prisma --skip-generate
          mysql -h127.0.0.1 -uroot -proot muyuan_upgrade -e "INSERT INTO User (id,name,email,passwordHash) VALUES ('upgrade-sentinel','Existing user','existing@example.com','preserve-me')"
          node scripts/production-init.mjs
          node scripts/production-init.mjs
          pnpm exec prisma migrate status
          test "$(mysql -h127.0.0.1 -uroot -proot -N muyuan_upgrade -e "SELECT COUNT(*) FROM User WHERE id='upgrade-sentinel' AND passwordHash='preserve-me'")" = "1"

      - name: Apply MySQL migrations
        run: pnpm exec prisma migrate deploy

      - name: Upgrade a database that already has the previous migrations
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/muyuan_reuse
        run: |
          # 复现生产升级路径：先应用除最新一条以外的全部迁移（等价于线上现状），
          # 再应用最新一条。若最新一条重复创建了已存在的表，这一步会失败。
          mysql -h127.0.0.1 -uroot -proot -e 'CREATE DATABASE muyuan_reuse'
          NEWEST="$(ls -1d prisma/migrations/*/ | sort | tail -1)"
          NEWEST="${NEWEST%/}"
          echo "newest migration under test: $NEWEST"
          mv "$NEWEST" /tmp/newest-migration
          pnpm exec prisma migrate deploy
          mv /tmp/newest-migration "$NEWEST"
          pnpm exec prisma migrate deploy
          echo "reused-deployment upgrade path OK"

      - name: Seed test database
        run: pnpm db:seed

      - name: Seed product library
        run: pnpm db:seed:products

      - name: Seed product library without .env (production parity)
        run: |
          mv .env .env.ci-backup
          pnpm db:seed:products
          mv .env.ci-backup .env

      - name: Verify product library
        run: |
          # 断言真实条数；失败时打印 SQL，便于定位
          check() {
            local got
            got=$(mysql -h127.0.0.1 -uroot -proot -N muyuan_test -e "$1")
            if [ "$got" != "$2" ]; then
              echo "FAIL: expected $2 but got $got :: $1"
              exit 1
            fi
            echo "ok  $got  :: $1"
          }
          atleast() {
            local got
            got=$(mysql -h127.0.0.1 -uroot -proot -N muyuan_test -e "$1")
            if [ "$got" -lt "$2" ]; then
              echo "FAIL: expected >= $2 but got $got :: $1"
              exit 1
            fi
            echo "ok  $got  :: $1"
          }

          # 28 个英文报价表型号 + 2 个仅见于中文报价表的 M 系列型号
          check "SELECT COUNT(*) FROM Product" "30"
          check "SELECT COUNT(*) FROM ProductVariant" "66"

          # 两层分类：2 个一级（压缩家具 / 智能床垫）+ 4 个二级（Y/D/C/M）
          check "SELECT COUNT(*) FROM ProductCategory" "6"
          check "SELECT COUNT(*) FROM ProductCategory WHERE level=1" "2"
          check "SELECT COUNT(*) FROM ProductCategory WHERE level=2" "4"
          # 旧分类已清理（D 系列曾被错归为沙发）
          check "SELECT COUNT(*) FROM ProductCategory WHERE code IN ('COMPRESSED_SOFA','COMPRESSED_BED')" "0"

          # 分类归属：Y 压缩沙发 / D 压缩单人椅 / C 压缩床 / M 压缩床垫
          check "SELECT COUNT(*) FROM Product p JOIN ProductCategory c ON p.categoryId=c.id WHERE p.model LIKE 'Y-%' AND c.code='SERIES_Y_SOFA'" "17"
          check "SELECT COUNT(*) FROM Product p JOIN ProductCategory c ON p.categoryId=c.id WHERE p.model LIKE 'D-%' AND c.code='SERIES_D_CHAIR'" "5"
          check "SELECT COUNT(*) FROM Product p JOIN ProductCategory c ON p.categoryId=c.id WHERE p.model LIKE 'C-%' AND c.code='SERIES_C_BED'" "6"
          check "SELECT COUNT(*) FROM Product p JOIN ProductCategory c ON p.categoryId=c.id WHERE p.model LIKE 'M-%' AND c.code='SERIES_M_MATTRESS'" "2"
          # 第一层级的智能床垫分类应为空（占位，等待上传产品）
          check "SELECT COUNT(*) FROM Product p JOIN ProductCategory c ON p.categoryId=c.id WHERE c.code='SMART_MATTRESS'" "0"

          # 美元价（英文报价表）与人民币价（中文报价表）并存
          check "SELECT COUNT(*) FROM ProductPrice WHERE currency='USD'" "58"
          check "SELECT COUNT(*) FROM ProductPrice WHERE currency='CNY'" "62"

          # 渠道 MOQ：线上 10 / 线下 20
          check "SELECT COUNT(*) FROM ProductMoq WHERE channel='ONLINE' AND minQty=10" "30"
          check "SELECT COUNT(*) FROM ProductMoq WHERE channel='OFFLINE' AND minQty=20" "30"

          # 中文材料名与中英文差异标记已写入
          atleast "SELECT COUNT(*) FROM ProductMaterial WHERE nameCn <> ''" "40"
          atleast "SELECT COUNT(*) FROM ProductVariant WHERE needsReview=1" "1"
          # 待核对原因必须分类：算术疑点应很少（真正需要修的只有个别几处），
          # 大部分是「两份资料不一致」或「图册未收录」，只需业务决定。
          atleast "SELECT COUNT(*) FROM ProductVariant WHERE reviewNote LIKE '[算术]%'" "1"
          # 回归护栏：英文报价表本身有多处 CBM 与包装算不通，实测 13 处；
          # 上限设为 20，既能容纳已知问题，又能在数量失控时报警。
          check "SELECT (SELECT COUNT(*) FROM ProductVariant WHERE reviewNote LIKE '[算术]%') <= 20" "1"
          atleast "SELECT COUNT(*) FROM ProductVariant WHERE reviewNote LIKE '[来源]%'" "5"
          atleast "SELECT COUNT(*) FROM ProductVariant WHERE reviewNote LIKE '[资料缺失]%'" "5"
          # 中英文不一致必须在具体变体上可见，且型号编号对调整型号登记
          atleast "SELECT COUNT(*) FROM ProductVariant WHERE reviewNote LIKE '%中英文报价表不一致%'" "5"
          atleast "SELECT COUNT(*) FROM ProductVariant WHERE reviewNote LIKE '%CN-10%'" "1"

          # 成本与毛利：新表 + Setting 汇率列，且默认值为 6.70
          check "SELECT COUNT(*) FROM information_schema.tables WHERE TABLE_SCHEMA='muyuan_test' AND TABLE_NAME='ProductCost'" "1"
          check "SELECT COUNT(*) FROM information_schema.columns WHERE TABLE_SCHEMA='muyuan_test' AND TABLE_NAME='Setting' AND COLUMN_NAME='usdCnyRate'" "1"
          check "SELECT CAST(usdCnyRate AS CHAR) FROM Setting WHERE id='system'" "6.7000"
          check "SELECT COUNT(*) FROM ProductCost" "0"
          # 成本绝不出现在普通产品列表接口的返回结构里（由 tests/product-cost.test.ts 断言）

          # 产品图：26 张图 + 26 条记录
          check "SELECT COUNT(*) FROM ProductMedia WHERE role='HERO'" "26"
          check "SELECT COUNT(*) FROM information_schema.tables WHERE TABLE_SCHEMA='muyuan_test' AND TABLE_NAME='Product'" "1"

      - name: Test
        run: pnpm test

      - name: Lint
        run: npm run lint

      - name: TypeScript strict check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: npm run build
