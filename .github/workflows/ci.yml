name: CRM CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/whatsapp-webhook

jobs:
  verify:
    name: Verify (${{ matrix.database.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: MySQL 8.4
            image: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1 -proot
          - name: MariaDB 11.8
            image: mariadb:11.8
            health: healthcheck.sh --connect --innodb_initialized
    services:
      mysql:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: muyuan_test
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: muyuan_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.database.health }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/muyuan_test
      AUTH_SECRET: ci-auth-secret-at-least-32-characters-long
      SEED_ADMIN_PASSWORD: ci-admin-password
      WEBHOOK_SECRET: ci-webhook-secret
      DEFAULT_TIMEZONE: Asia/Shanghai
      DEFAULT_CURRENCY: CNY
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare CI env file
        run: |
          cat > .env <<'EOF'
          DATABASE_URL="mysql://root:root@127.0.0.1:3306/muyuan_test"
          AUTH_SECRET="ci-auth-secret-at-least-32-characters-long"
          SEED_ADMIN_PASSWORD="ci-admin-password"
          WEBHOOK_SECRET="ci-webhook-secret"
          DEFAULT_TIMEZONE="Asia/Shanghai"
          DEFAULT_CURRENCY="CNY"
          EOF

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Verify existing MySQL automatic upgrade
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/muyuan_upgrade
        run: |
          mysql -h127.0.0.1 -uroot -proot -e 'CREATE DATABASE muyuan_upgrade'
          pnpm exec prisma db push --schema prisma/baseline/schema.prisma --skip-generate
          mysql -h127.0.0.1 -uroot -proot muyuan_upgrade -e "INSERT INTO User (id,name,email,passwordHash) VALUES ('upgrade-sentinel','Existing user','existing@example.com','preserve-me')"
          node scripts/production-init.mjs
          node scripts/production-init.mjs
          pnpm exec prisma migrate status
          test "$(mysql -h127.0.0.1 -uroot -proot -N muyuan_upgrade -e "SELECT COUNT(*) FROM User WHERE id='upgrade-sentinel' AND passwordHash='preserve-me'")" = "1"

      - name: Apply MySQL migrations
        run: pnpm exec prisma migrate deploy

      - name: Upgrade a database that already has the previous migrations
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/muyuan_reuse
        run: |
          # 从 13 条旧迁移升级至当前版本，验证身份链、销售角色、分配池、报价单、表单分级推送与客户列表定制列增量迁移。
          mysql -h127.0.0.1 -uroot -proot -e 'CREATE DATABASE muyuan_reuse'
          mkdir /tmp/identity-ci-migrations
          trap 'for migration in /tmp/identity-ci-migrations/*; do [ ! -d "$migration" ] || mv "$migration" prisma/migrations/; done' EXIT
          mv prisma/migrations/20261003153000_identity_chain_foundation /tmp/identity-ci-migrations/
          mv prisma/migrations/20261003163000_whatsapp_provider_account_identity /tmp/identity-ci-migrations/
          mv prisma/migrations/20261003170000_meta_import_result_payload /tmp/identity-ci-migrations/
          mv prisma/migrations/20261004023000_gupshup_live_identity /tmp/identity-ci-migrations/
          mv prisma/migrations/20261006090000_sales_role_workspace /tmp/identity-ci-migrations/
          mv prisma/migrations/20261009024647_assignment_pool_and_corrections /tmp/identity-ci-migrations/
          mv prisma/migrations/20261009035838_meta_lead_realtime_intake /tmp/identity-ci-migrations/
          mv prisma/migrations/20261011090000_quotation_builder /tmp/identity-ci-migrations/
          mv prisma/migrations/20261014143255_lead_grade_and_push_alerts /tmp/identity-ci-migrations/
          mv prisma/migrations/20261015120000_customer_list_column_preference /tmp/identity-ci-migrations/
          pnpm exec prisma migrate deploy
          test "$(mysql -h127.0.0.1 -uroot -proot -N muyuan_reuse -e 'SELECT COUNT(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL')" = "13"
          mysql -h127.0.0.1 -uroot -proot muyuan_reuse -e "INSERT INTO User (id,name,email,passwordHash) VALUES ('reuse-sentinel','Existing user','existing@example.com','preserve-me')"
          mv /tmp/identity-ci-migrations/* prisma/migrations/
          pnpm exec prisma migrate deploy
          test "$(mysql -h127.0.0.1 -uroot -proot -N muyuan_reuse -e 'SELECT COUNT(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL')" = "23"
          # 分配池、联系方式规范键、任务执行人与线索分配方式（20261009024647_assignment_pool_and_corrections）
          test "$(mysql -h127.0.0.1 -uroot -proot -N muyuan_reuse -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='muyuan_reuse' AND ((table_name='Customer' AND column_name IN ('pendingAssignment','contactKeysAt')) OR (table_name='Task' AND column_name='assigneeId') OR (table_name='Setting' AND column_name='leadAssignMode'))")" = "4"
          # 广告线索实时入库：来源、提交时间、重试退避、表单补拉水位与广告线索首联分钟数（20261009035838_meta_lead_realtime_intake）
          test "$(mysql -h127.0.0.1 -uroot -proot -N muyuan_reuse -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='muyuan_reuse' AND ((table_name='MetaLeadEvent' AND column_name IN ('receivedVia','metaCreatedAt','attempts','nextAttemptAt')) OR (table_name='MetaLeadForm' AND column_name IN ('pollWatermark','polledAt')) OR (table_name='Setting' AND column_name='adLeadFirstContactMinutes'))")" = "7"
          test "$(mysql -h127.0.0.1 -uroot -proot -N muyuan_reuse -e "SELECT COUNT(*) FROM User WHERE id='reuse-sentinel' AND passwordHash='preserve-me' AND isActive=1 AND sessionVersion=0")" = "1"
          test "$(mysql -h127.0.0.1 -uroot -proot -N muyuan_reuse -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='muyuan_reuse' AND table_name IN ('UserSalesTarget','CustomerAssignment','AccountAudit')")" = "3"
          # 报价单：明细、运费库、模板三张新表，报价总额与单据快照列，欧元汇率（20261011090000_quotation_builder）
          test "$(mysql -h127.0.0.1 -uroot -proot -N muyuan_reuse -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='muyuan_reuse' AND table_name IN ('QuotationItem','FreightRate','QuoteTemplate')")" = "3"
          test "$(mysql -h127.0.0.1 -uroot -proot -N muyuan_reuse -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='muyuan_reuse' AND ((table_name='Quotation' AND column_name IN ('totalAmount','documentJson','language','freightRateId')) OR (table_name='Setting' AND column_name='eurCnyRate'))")" = "5"
          # 表单分级与手机推送：客户等级字段、推送密钥、推送设备与线索提醒发件箱（20261014143255_lead_grade_and_push_alerts）
          test "$(mysql -h127.0.0.1 -uroot -proot -N muyuan_reuse -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='muyuan_reuse' AND ((table_name='Customer' AND column_name IN ('leadGrade','leadGradeReason','leadGradeSource','leadGradedAt')) OR (table_name='Setting' AND column_name IN ('pushPublicKey','pushPrivateKey')))")" = "6"
          test "$(mysql -h127.0.0.1 -uroot -proot -N muyuan_reuse -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='muyuan_reuse' AND table_name IN ('PushSubscription','LeadAlert')")" = "2"
          # 客户列表定制列：每位用户的列表视图（20261015120000_customer_list_column_preference）
          test "$(mysql -h127.0.0.1 -uroot -proot -N muyuan_reuse -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='muyuan_reuse' AND table_name='UserViewPreference'")" = "1"
          echo "reused-deployment upgrade path OK"

      - name: Seed test database
        run: pnpm db:seed

      - name: Seed product library
        run: pnpm db:seed:products

      - name: Seed product library without .env (production parity)
        run: |
          mv .env .env.ci-backup
          pnpm db:seed:products
          mv .env.ci-backup .env

      - name: Verify product library
        run: |
          # 断言真实条数；失败时打印 SQL，便于定位
          check() {
            local got
            got=$(mysql -h127.0.0.1 -uroot -proot -N muyuan_test -e "$1")
            if [ "$got" != "$2" ]; then
              echo "FAIL: expected $2 but got $got :: $1"
              exit 1
            fi
            echo "ok  $got  :: $1"
          }
          atleast() {
            local got
            got=$(mysql -h127.0.0.1 -uroot -proot -N muyuan_test -e "$1")
            if [ "$got" -lt "$2" ]; then
              echo "FAIL: expected >= $2 but got $got :: $1"
              exit 1
            fi
            echo "ok  $got  :: $1"
          }

          # 28 个英文报价表型号 + 2 个仅见于中文报价表的 M 系列型号
          check "SELECT COUNT(*) FROM Product" "30"
          check "SELECT COUNT(*) FROM ProductVariant" "66"

          # 两层分类：2 个一级（压缩家具 / 智能床垫）+ 4 个二级（Y/D/C/M）
          check "SELECT COUNT(*) FROM ProductCategory" "6"
          check "SELECT COUNT(*) FROM ProductCategory WHERE level=1" "2"
          check "SELECT COUNT(*) FROM ProductCategory WHERE level=2" "4"
          # 旧分类已清理（D 系列曾被错归为沙发）
          check "SELECT COUNT(*) FROM ProductCategory WHERE code IN ('COMPRESSED_SOFA','COMPRESSED_BED')" "0"

          # 分类归属：Y 压缩沙发 / D 压缩单人椅 / C 压缩床 / M 压缩床垫
          check "SELECT COUNT(*) FROM Product p JOIN ProductCategory c ON p.categoryId=c.id WHERE p.model LIKE 'Y-%' AND c.code='SERIES_Y_SOFA'" "17"
          check "SELECT COUNT(*) FROM Product p JOIN ProductCategory c ON p.categoryId=c.id WHERE p.model LIKE 'D-%' AND c.code='SERIES_D_CHAIR'" "5"
          check "SELECT COUNT(*) FROM Product p JOIN ProductCategory c ON p.categoryId=c.id WHERE p.model LIKE 'C-%' AND c.code='SERIES_C_BED'" "6"
          check "SELECT COUNT(*) FROM Product p JOIN ProductCategory c ON p.categoryId=c.id WHERE p.model LIKE 'M-%' AND c.code='SERIES_M_MATTRESS'" "2"
          # 第一层级的智能床垫分类应为空（占位，等待上传产品）
          check "SELECT COUNT(*) FROM Product p JOIN ProductCategory c ON p.categoryId=c.id WHERE c.code='SMART_MATTRESS'" "0"

          # 美元价（英文报价表）与人民币价（中文报价表）并存
          check "SELECT COUNT(*) FROM ProductPrice WHERE currency='USD'" "58"
          check "SELECT COUNT(*) FROM ProductPrice WHERE currency='CNY'" "66"

          # 渠道 MOQ：线上 10 / 线下 20
          check "SELECT COUNT(*) FROM ProductMoq WHERE channel='ONLINE' AND minQty=10" "30"
          check "SELECT COUNT(*) FROM ProductMoq WHERE channel='OFFLINE' AND minQty=20" "30"

          # 中文材料名与中英文差异标记已写入
          atleast "SELECT COUNT(*) FROM ProductMaterial WHERE nameCn <> ''" "40"
          atleast "SELECT COUNT(*) FROM ProductVariant WHERE needsReview=1" "1"
          # 待核对原因必须分类：算术疑点应很少（真正需要修的只有个别几处），
          # 大部分是「两份资料不一致」或「图册未收录」，只需业务决定。
          atleast "SELECT COUNT(*) FROM ProductVariant WHERE reviewNote LIKE '[算术]%'" "1"
          # 回归护栏：报价表本身有多处 CBM 与包装算不通，实测 10 处；
          # 上限设为 20，既能容纳已知问题，又能在数量失控时报警。
          check "SELECT (SELECT COUNT(*) FROM ProductVariant WHERE reviewNote LIKE '[算术]%') <= 20" "1"
          atleast "SELECT COUNT(*) FROM ProductVariant WHERE reviewNote LIKE '[来源]%'" "5"
          atleast "SELECT COUNT(*) FROM ProductVariant WHERE reviewNote LIKE '[资料缺失]%'" "1"

          # 压缩沙发以 2026 图册为准（docs/product-os/catalog-2026-sofas.json）：
          # Y-615 是 105 / 150 / 210 宽的单座，Y-616 是 290 × 95 × 85（英文报价表把两者记反了）
          check "SELECT GROUP_CONCAT(CONCAT(v.lengthCm,'x',v.widthCm,'x',v.heightCm) ORDER BY v.lengthCm) FROM ProductVariant v JOIN Product p ON p.id=v.productId WHERE p.model='Y-615'" "105x105x87,150x105x87,210x105x87"
          check "SELECT GROUP_CONCAT(CONCAT(v.lengthCm,'x',v.widthCm,'x',v.heightCm)) FROM ProductVariant v JOIN Product p ON p.id=v.productId WHERE p.model='Y-616'" "290x95x85"
          check "SELECT CAST(pr.unitPrice AS CHAR) FROM ProductPrice pr JOIN ProductVariant v ON v.id=pr.variantId WHERE v.sku='Y-616-290x95x85' AND pr.currency='CNY'" "1750.00"
          # 已按图册定下的来源差异只留档，不计入待核对；仍待核对的只剩算不通或图册自己标注待确认的
          check "SELECT COUNT(*) FROM ProductVariant WHERE reviewNote LIKE '%中英文报价表不一致%'" "0"
          atleast "SELECT COUNT(*) FROM ProductVariant WHERE needsReview=0 AND reviewNote LIKE '[已确认]%'" "20"

          # 成本与毛利：新表 + Setting 汇率列，且默认值为 6.70
          check "SELECT COUNT(*) FROM information_schema.tables WHERE TABLE_SCHEMA='muyuan_test' AND TABLE_NAME='ProductCost'" "1"
          check "SELECT COUNT(*) FROM information_schema.columns WHERE TABLE_SCHEMA='muyuan_test' AND TABLE_NAME='Setting' AND COLUMN_NAME='usdCnyRate'" "1"
          check "SELECT CAST(usdCnyRate AS CHAR) FROM Setting WHERE id='system'" "6.7000"
          check "SELECT COUNT(*) FROM ProductCost" "0"
          # 成本绝不出现在普通产品列表接口的返回结构里（由 tests/product-cost.test.ts 断言）

          # 产品图：28 张图 + 28 条记录（M-801 / M-802 暂无图）
          check "SELECT COUNT(*) FROM ProductMedia WHERE role='HERO'" "28"
          check "SELECT COUNT(*) FROM information_schema.tables WHERE TABLE_SCHEMA='muyuan_test' AND TABLE_NAME='Product'" "1"

      - name: Verify action center and Meta Lead Ads schema
        run: |
          check() {
            local got
            got=$(mysql -h127.0.0.1 -uroot -proot -N muyuan_test -e "$1")
            if [ "$got" != "$2" ]; then
              echo "FAIL: expected $2 but got $got :: $1"
              exit 1
            fi
            echo "ok  $got  :: $1"
          }
          # 任务必须能追溯到业务对象
          check "SELECT COUNT(*) FROM information_schema.columns WHERE TABLE_SCHEMA='muyuan_test' AND TABLE_NAME='Task' AND COLUMN_NAME IN ('orderId','amount','aiReason')" "3"
          check "SELECT COUNT(*) FROM information_schema.referential_constraints WHERE CONSTRAINT_SCHEMA='muyuan_test' AND TABLE_NAME='Task' AND REFERENCED_TABLE_NAME='Order'" "1"
          # leadgen_id 唯一约束是幂等键：Meta 重复推送不会造成重复客户
          check "SELECT COUNT(*) FROM information_schema.tables WHERE TABLE_SCHEMA='muyuan_test' AND TABLE_NAME='MetaLeadEvent'" "1"
          check "SELECT COUNT(DISTINCT INDEX_NAME) FROM information_schema.statistics WHERE TABLE_SCHEMA='muyuan_test' AND TABLE_NAME='MetaLeadEvent' AND COLUMN_NAME='leadgenId' AND NON_UNIQUE=0" "1"
          check "SELECT COUNT(*) FROM information_schema.columns WHERE TABLE_SCHEMA='muyuan_test' AND TABLE_NAME='MetaLeadEvent' AND COLUMN_NAME IN ('leadgenId','pageId','formId','customerId','rawPayload')" "5"

      - name: Backfill orders from existing deals
        run: pnpm db:seed:orders

      - name: Verify order management
        run: |
          check() {
            local got
            got=$(mysql -h127.0.0.1 -uroot -proot -N muyuan_test -e "$1")
            if [ "$got" != "$2" ]; then
              echo "FAIL: expected $2 but got $got :: $1"
              exit 1
            fi
            echo "ok  $got  :: $1"
          }
          atleast() {
            local got
            got=$(mysql -h127.0.0.1 -uroot -proot -N muyuan_test -e "$1")
            if [ "$got" -lt "$2" ]; then
              echo "FAIL: expected at least $2 but got $got :: $1"
              exit 1
            fi
            echo "ok  $got  :: $1"
          }
          # 订单表由迁移创建，且不含产品信息列（订单不展示产品信息）
          # 注意用精确列名：LIKE '%roduct%' 会误伤 productionStatus
          check "SELECT COUNT(*) FROM information_schema.tables WHERE TABLE_SCHEMA='muyuan_test' AND TABLE_NAME='Order'" "1"
          check "SELECT COUNT(*) FROM information_schema.columns WHERE TABLE_SCHEMA='muyuan_test' AND TABLE_NAME='Order' AND COLUMN_NAME IN ('product','productId','productModel','productName','productSku','productVariantId')" "0"
          # 产品库种子里的 12 笔成交应全部补齐订单
          atleast "SELECT COUNT(*) FROM \`Order\`" "12"
          check "SELECT COUNT(*) FROM \`Order\` WHERE dealId IS NULL" "0"
          # 每笔成交只对应一张订单
          check "SELECT COUNT(*) FROM (SELECT dealId FROM \`Order\` GROUP BY dealId HAVING COUNT(*) > 1) x" "0"
          # 订单号形如 LV20260925-001
          check "SELECT COUNT(*) FROM \`Order\` WHERE orderNo NOT REGEXP '^LV[0-9]{8}-[0-9]{3}$'" "0"
          # 新单默认状态
          check "SELECT COUNT(*) FROM \`Order\` WHERE status='PENDING_PAYMENT' AND paymentStatus='UNPAID'" "12"
          # 金额统一人民币，且美元成交保留原币金额以便核对
          check "SELECT COUNT(*) FROM \`Order\` WHERE amountRMB <= 0" "0"

      - name: Test
        run: pnpm test

      - name: Lint
        run: npm run lint

      - name: TypeScript strict check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: npm run build
