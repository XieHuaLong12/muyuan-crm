<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsApp 本地同步</title><link rel="stylesheet" href="popup.css"></head><body>
<header><small>LVANJU BOS</small><h1>WhatsApp 本地同步</h1><p>只读取已加载的消息，由你手动操作。</p></header>
<section><label>CRM 地址<input id="crm" type="url" placeholder="https://你的CRM域名" autocomplete="off"></label><label>同步授权码<input id="token" type="password" placeholder="在 CRM 同步管理页创建" autocomplete="off"></label><label>当前登录的本人 WhatsApp 国际号码<input id="accountPhone" placeholder="+8613812345678" autocomplete="off"></label><label>聊天时间的日期顺序<select id="dateOrder"><option value="DMY">日/月/年</option><option value="MDY">月/日/年</option></select></label><small>时间按本机时区解析。请确认号码与 WhatsApp Web 当前账号及 CRM 授权一致；换账号后重新填写。授权码仅保留在本次浏览器会话中。</small><button id="save">保存本次连接</button></section>
<section class="actions"><button id="preview">预览匹配结果</button><button id="current">同步当前聊天</button><button id="loaded">同步已加载聊天</button><small>匹配客户前，请打开 WhatsApp 聊天的联系人信息，让号码显示在页面中。“已加载”指所有已打开 WhatsApp Web 标签页中当前显示的聊天；不会逐个点击联系人或翻页。</small></section>
<section id="result" role="status" aria-live="polite">尚未读取消息。</section><script src="popup.js"></script></body></html>
